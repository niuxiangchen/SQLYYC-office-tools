    <script>
      (function redirectGitHubPagesSpa(location) {
        if (!location.search.startsWith("?/")) {
          return;
        }

        const route = location.search
          .slice(1)
          .split("&")
          .map((part, index) => (index === 0 ? part : part.replace(/~and~/g, "&")))
          .join("?");
        const basePath = location.pathname.replace(/\/$/, "");

        window.history.replaceState(null, "", `${basePath}${route}${location.hash}`);
      })(window.location);
    </script>
